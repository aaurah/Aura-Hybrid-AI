kind = "web"
previewPath = "/"
title = "AuraAI"
version = "1.0.0"
id = "artifacts/aura-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20701

[services.development]
run = "pnpm --filter @workspace/aura-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aura-ui", "run", "build" ]
publicDir = "artifacts/aura-ui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20701"
BASE_PATH = "/"
